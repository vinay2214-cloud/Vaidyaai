steps:
  # 1. Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/vaidyaai-docker-repo/vaidyaai-backend:$SHORT_SHA'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/vaidyaai-docker-repo/vaidyaai-backend:latest'
      - './backend'

  # 2. Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/vaidyaai-docker-repo/vaidyaai-backend:$SHORT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/vaidyaai-docker-repo/vaidyaai-backend:latest'

  # 3. Deploy to Cloud Run
  # ENVIRONMENT=production is REQUIRED: without it the backend defaults to
  # development (dev auth bypass + in-memory document store). All secrets are
  # referenced from Secret Manager by name; the values are never in this file.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'vaidyaai-backend'
      - '--image=asia-south1-docker.pkg.dev/$PROJECT_ID/vaidyaai-docker-repo/vaidyaai-backend:$SHORT_SHA'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--min-instances=1'
      - '--max-instances=10'
      - '--concurrency=80'
      - '--timeout=300s'
      - '--allow-unauthenticated'
      - '--service-account=vaidyaai-backend@$PROJECT_ID.iam.gserviceaccount.com'
      - '--set-env-vars=ENVIRONMENT=production,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GCP_REGION=asia-south1,FIREBASE_PROJECT_ID=$PROJECT_ID,GOOGLE_GENAI_USE_VERTEXAI=true,LIVE_CLINICAL_AI=true,AI_ALLOW_MOCK_FALLBACK=false,FEATURE_RAZORPAY=false,FEATURE_WHATSAPP=false,CLOUD_TASKS_LOCATION=asia-south1,CLOUD_TASKS_QUEUE_REMINDERS=appointment-reminders,CLOUD_TASKS_QUEUE_BILLING=billing-followups,CLOUD_TASKS_QUEUE_RETENTION=retention-outreach,CORS_ORIGINS=https://vaidyaai-frontend-$PROJECT_NUMBER.asia-south1.run.app'
      # Only secrets that actually exist in Secret Manager may be referenced here;
      # naming a missing secret makes the whole `gcloud run deploy` fail. The
      # Razorpay/WhatsApp integrations run in mock mode (FEATURE_*=false above),
      # so their credentials are intentionally not wired. When those secrets are
      # created, add them here and flip the corresponding feature flag.
      - '--set-secrets=DATABASE_URL=DATABASE_URL:latest,INTERNAL_TASK_SECRET=INTERNAL_TASK_SECRET:latest,BACKEND_URL=BACKEND_URL:latest'

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/vaidyaai-docker-repo/vaidyaai-backend:$SHORT_SHA'
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/vaidyaai-docker-repo/vaidyaai-backend:latest'
