name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: development
      DATABASE_URL: "sqlite+aiosqlite:///./test.db"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg (STT audio pipeline dependency)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Byte-compile sources
        run: python -m compileall -q agents api services utils database models tasks config.py main.py
      - name: Run tests
        run: pytest -q

  frontend:
    name: Frontend (typecheck + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      # frontend/next.config.mjs refuses to run a production build without a
      # complete Firebase Web App config, so that a deployable image can never be
      # produced with broken auth. CI only verifies that the app compiles, so it
      # supplies non-secret placeholder values here. Real values are injected as
      # Docker build args by infrastructure/frontend-cloudbuild.yaml.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder-api-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: vaidyaai-xprize.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: vaidyaai-xprize
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: vaidyaai-xprize.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:ciplaceholder"
          NEXT_PUBLIC_DEV_AUTH_BYPASS: "false"
          NEXT_PUBLIC_USE_FIREBASE_EMULATOR: "false"
